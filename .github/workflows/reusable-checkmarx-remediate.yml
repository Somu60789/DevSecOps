name: Reusable — Checkmarx Scan & Remediate

# Scan the caller's default branch with Checkmarx SAST, remediate all findings,
# and open a remediation PR. Never pushes to the default branch. Call from a
# scheduled / manual workflow in the caller repo:
#
#   checkmarx:
#     uses: Somu60789/DevSecOps/.github/workflows/reusable-checkmarx-remediate.yml@v1
#     secrets: inherit

on:
  workflow_call:
    inputs:
      product_repo:
        type: string
        default: Somu60789/DevSecOps
      product_ref:
        type: string
        default: v1
      scan_ref:
        description: Branch to scan (defaults to the caller's default branch)
        type: string
        default: ""
    secrets:
      CX_SERVER_URL:
        required: true
      CX_USERNAME:
        required: true
      CX_PASSWORD:
        required: true
      CX_TEAM:
        required: true
      AGENT_API_KEY:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      has_findings: ${{ steps.collect.outputs.has_findings }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.scan_ref || github.event.repository.default_branch }}
          fetch-depth: 0
      - name: load product tooling
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.product_repo }}
          ref: ${{ inputs.product_ref }}
          path: ._devsecops
      - name: Checkmarx SAST scan
        uses: ./._devsecops/.github/actions/checkmarx-scan
        with:
          cx-server-url: ${{ secrets.CX_SERVER_URL }}
          cx-username: ${{ secrets.CX_USERNAME }}
          cx-password: ${{ secrets.CX_PASSWORD }}
          cx-team: ${{ secrets.CX_TEAM }}
          project-name: ${{ github.event.repository.name }}
          output-file: checkmarx.sarif
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: normalize Checkmarx findings
        id: collect
        run: |
          set -euo pipefail
          gen_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 ._devsecops/scripts/collect-findings.py \
            --generated-at "$gen_at" --out findings.json \
            --inputs checkmarx:sast:checkmarx.sarif
          count="$(python3 -c 'import json; print(len(json.load(open("findings.json"))["findings"]))')"
          echo "has_findings=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: checkmarx-findings
          path: |
            checkmarx.sarif
            findings.json
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkmarx.sarif
          category: checkmarx

  remediate:
    needs: scan
    if: needs.scan.outputs.has_findings == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AGENT_CMD: ${{ vars.AGENT_CMD }}
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
      SCAN_REF: ${{ inputs.scan_ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.scan_ref || github.event.repository.default_branch }}
          fetch-depth: 0
      - name: load product tooling
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.product_repo }}
          ref: ${{ inputs.product_ref }}
          path: ._devsecops
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: fetch normalized findings
        uses: actions/download-artifact@v8
        with:
          name: checkmarx-findings
          path: .
      - name: create remediation branch
        id: branch
        run: |
          set -euo pipefail
          date_tag="$(date -u +%Y%m%d)"
          branch="bot/code-fix-${date_tag}"
          git config user.name "devsecops-bot"
          git config user.email "devsecops-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch"
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: stage 2 — triage
        continue-on-error: true
        run: bash ._devsecops/scripts/run-agent.sh triage findings.json --out agent-triage.json
      - name: stage 3b — remediate all findings
        id: fix
        continue-on-error: true
        run: bash ._devsecops/scripts/run-agent.sh fix-all findings.json --out agent-fix-all.json
      - name: commit remediations
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- . ':(exclude)._devsecops'; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "agent produced no file changes"
            exit 0
          fi
          git add -- . ':(exclude)._devsecops'
          git commit -m "fix: remediate Checkmarx SAST findings"
          git push origin "HEAD:${{ steps.branch.outputs.name }}"
          echo "committed=true" >> "$GITHUB_OUTPUT"
      - name: open remediation PR
        if: steps.commit.outputs.committed == 'true'
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          base="${{ github.event.repository.default_branch }}"
          if [ -n "$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')" ]; then
            echo "PR already open for $BRANCH_NAME"
            exit 0
          fi
          summary="$(python3 ._devsecops/scripts/summarize-remediation.py agent-fix-all.json || echo 'See changed files.')"
          {
            echo "Automated Checkmarx SAST remediation against \`$SCAN_REF\`."
            echo
            echo "$summary"
            echo
            echo "Lines annotated with \`REVIEW:\` are higher-risk fixes that need careful review before merge. This PR must be reviewed and merged by a human."
          } > pr-body.md
          gh pr create --base "$base" --head "$BRANCH_NAME" \
            --title "fix: remediate Checkmarx SAST findings ($(date -u +%Y-%m-%d))" \
            --body-file pr-body.md
