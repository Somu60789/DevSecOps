name: Reusable — Continuous Docs

# Regenerate docs for the caller's repo. On pull_request, commits doc changes
# onto the PR branch; on schedule/dispatch, opens/refreshes a bot/docs-update PR.
#
#   docs:
#     uses: Somu60789/DevSecOps/.github/workflows/reusable-docs.yml@v1
#     secrets: inherit

on:
  workflow_call:
    inputs:
      product_repo:
        type: string
        default: Somu60789/DevSecOps
      product_ref:
        type: string
        default: v1

permissions:
  contents: write
  pull-requests: write

jobs:
  per-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: load product tooling
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.product_repo }}
          ref: ${{ inputs.product_ref }}
          path: ._devsecops
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: regenerate docs
        run: python3 ._devsecops/scripts/gen-docs.py --root . --out docs
      - name: commit doc changes to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "devsecops-bot"
          git config user.email "devsecops-bot@users.noreply.github.com"
          if git diff --quiet -- docs; then
            echo "docs already in sync"
            exit 0
          fi
          git add docs
          git commit -m "docs: sync documentation with code changes"
          git push origin "HEAD:$HEAD_REF"

  nightly-sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: load product tooling
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.product_repo }}
          ref: ${{ inputs.product_ref }}
          path: ._devsecops
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: check for doc drift
        id: check
        run: |
          if python3 ._devsecops/scripts/gen-docs.py --root . --out docs --check; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
      - name: open or refresh bot/docs-update PR
        if: steps.check.outputs.drift == 'true'
        run: |
          set -euo pipefail
          git config user.name "devsecops-bot"
          git config user.email "devsecops-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin bot/docs-update >/dev/null 2>&1; then
            git fetch origin bot/docs-update
            git checkout -B bot/docs-update origin/bot/docs-update
          else
            git checkout -B bot/docs-update
          fi
          python3 ._devsecops/scripts/gen-docs.py --root . --out docs
          if git diff --quiet -- docs; then
            echo "no drift after rebasing onto existing branch"
            exit 0
          fi
          git add docs
          git commit -m "docs: nightly sweep — sync drifted documentation"
          git push origin bot/docs-update
          if [ -z "$(gh pr list --head bot/docs-update --json number --jq '.[0].number')" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" \
              --head bot/docs-update \
              --title "docs: nightly documentation sync" \
              --body "Automated nightly sweep detected documentation drift and regenerated the affected docs."
          fi
