name: DevSecOps Scanners

# Stage 1: deterministic scanners only — no AI. Produces SARIF (uploaded to code
# scanning) plus a single normalized findings.json artifact for the AI stages.
# Every scanner job is non-fatal so one failure never blocks the others.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # nightly full sweep

permissions:
  contents: read
  security-events: write # upload SARIF to code scanning

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-stack:
    runs-on: ubuntu-latest
    outputs:
      has_node: ${{ steps.detect.outputs.has_node }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_docker: ${{ steps.detect.outputs.has_docker }}
      has_iac: ${{ steps.detect.outputs.has_iac }}
    steps:
      - uses: actions/checkout@v6
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          has() { [ -n "$(find . -name "$1" -not -path './.git/*' -print -quit)" ] && echo true || echo false; }
          {
            echo "has_node=$(has package.json)"
            echo "has_python=$( { [ "$(has requirements.txt)" = true ] || [ "$(has pyproject.toml)" = true ] || [ "$(has setup.py)" = true ]; } && echo true || echo false)"
            echo "has_docker=$(has Dockerfile)"
            echo "has_iac=$( { [ "$(has '*.tf')" = true ] || [ -d .github/workflows ] || [ "$(has docker-compose.yml)" = true ]; } && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  secrets:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --report-format json --report-path gitleaks.json --no-git --redact
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-secrets
          path: gitleaks.json
          if-no-files-found: ignore

  sast:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
          generateSarif: "1"
      - name: rename sarif
        if: always()
        shell: bash
        run: test -f semgrep.sarif && cp semgrep.sarif sast.sarif || echo "{}" > sast.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true # no-op on repos without Advanced Security
        with:
          sarif_file: sast.sarif
          category: semgrep
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-sast
          path: sast.sarif
          if-no-files-found: ignore

  checkmarx:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      # Only scan when Checkmarx credentials are configured; otherwise emit an
      # empty SARIF so the collect step has a consistent artifact to read.
      - name: check for Checkmarx credentials
        id: cx
        shell: bash
        env:
          CX_SERVER_URL: ${{ secrets.CX_SERVER_URL }}
        run: echo "configured=$([ -n "$CX_SERVER_URL" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Checkmarx SAST scan
        if: steps.cx.outputs.configured == 'true'
        uses: ./.github/actions/checkmarx-scan
        with:
          cx-server-url: ${{ secrets.CX_SERVER_URL }}
          cx-username: ${{ secrets.CX_USERNAME }}
          cx-password: ${{ secrets.CX_PASSWORD }}
          cx-team: ${{ secrets.CX_TEAM }}
          project-name: ${{ github.event.repository.name }}
          output-file: checkmarx.sarif
      - name: ensure SARIF exists
        if: always()
        shell: bash
        run: test -f checkmarx.sarif || echo '{"runs":[]}' > checkmarx.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true # no-op on repos without Advanced Security
        with:
          sarif_file: checkmarx.sarif
          category: checkmarx
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-checkmarx
          path: checkmarx.sarif
          if-no-files-found: ignore

  sca-and-iac:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: trivy filesystem (SCA + license + secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif
          scanners: vuln,license,secret
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true # no-op on repos without Advanced Security
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: checkov (IaC)
        uses: bridgecrewio/checkov-action@v12
        with:
          output_format: sarif
          output_file_path: checkov.sarif
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-sca-iac
          path: |
            trivy-fs.sarif
            checkov.sarif
          if-no-files-found: ignore

  clean-code:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: detect-stack
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: complexity (lizard)
        shell: bash
        run: |
          pip install --quiet lizard
          lizard -X . > lizard.xml 2>/dev/null || echo "<root/>" > lizard.xml
      - name: duplication (jscpd)
        shell: bash
        run: |
          npx --yes jscpd --silent --reporters json --output ./jscpd-report . || true
          test -f ./jscpd-report/jscpd-report.json && cp ./jscpd-report/jscpd-report.json jscpd.json || echo "{}" > jscpd.json
      - name: dead code (vulture)
        if: needs.detect-stack.outputs.has_python == 'true'
        shell: bash
        run: |
          pip install --quiet vulture
          vulture . --min-confidence 80 > vulture.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-clean-code
          path: |
            lizard.xml
            jscpd.json
            vulture.txt
          if-no-files-found: ignore

  collect:
    runs-on: ubuntu-latest
    needs: [secrets, sast, checkmarx, sca-and-iac, clean-code]
    if: always()
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: normalize findings
        shell: bash
        run: |
          set -euo pipefail
          gen_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          inputs=()
          [ -f artifacts/scan-secrets/gitleaks.json ] && inputs+=("gitleaks:secret:artifacts/scan-secrets/gitleaks.json")
          [ -f artifacts/scan-sast/sast.sarif ] && inputs+=("semgrep:sast:artifacts/scan-sast/sast.sarif")
          [ -f artifacts/scan-checkmarx/checkmarx.sarif ] && inputs+=("checkmarx:sast:artifacts/scan-checkmarx/checkmarx.sarif")
          [ -f artifacts/scan-sca-iac/trivy-fs.sarif ] && inputs+=("trivy:sca:artifacts/scan-sca-iac/trivy-fs.sarif")
          [ -f artifacts/scan-sca-iac/checkov.sarif ] && inputs+=("checkov:iac:artifacts/scan-sca-iac/checkov.sarif")
          [ -f artifacts/scan-clean-code/jscpd.json ] && inputs+=("jscpd:duplication:artifacts/scan-clean-code/jscpd.json")
          python3 scripts/collect-findings.py --generated-at "$gen_at" --out findings.json --inputs "${inputs[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: findings
          path: findings.json
