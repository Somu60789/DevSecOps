name: Reusable — Gradle Build & Publish

# Java/Gradle build + test, then build & publish a Docker image to any cloud
# registry (and/or save it as a workflow artifact). Matches the Gradle + Docker
# + ECR shape common in Java/Spring estates.
#
#   build:
#     uses: Somu60789/DevSecOps/.github/workflows/reusable-build-gradle.yml@v1
#     secrets: inherit
#     with:
#       java_version: "21"
#       registry: ecr
#       registry_host: 123456789.dkr.ecr.us-east-1.amazonaws.com

on:
  workflow_call:
    inputs:
      product_repo:
        type: string
        default: Somu60789/DevSecOps
      product_ref:
        type: string
        default: v1
      java_version:
        type: string
        default: "21"
      gradle_tasks:
        description: Gradle tasks to run (build runs tests by default)
        type: string
        default: "build"
      run_tests:
        type: boolean
        default: true
      # --- image publish ---
      build_image:
        description: Build a Docker image after the Gradle build
        type: boolean
        default: true
      registry:
        description: "ecr | ghcr | gcp | acr | dockerhub | none"
        type: string
        default: ghcr
      registry_host:
        type: string
        default: ""
      image_name:
        type: string
        default: ""
      extra_tag:
        type: string
        default: ""
      push_image:
        type: boolean
        default: true
      save_image_artifact:
        type: boolean
        default: false
      aws_region:
        type: string
        default: us-east-1
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false
      GCP_CREDENTIALS_JSON:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_ROLE_ARN:
        required: false
    outputs:
      image_ref:
        description: Published image reference
        value: ${{ jobs.build.outputs.image_ref }}

permissions:
  contents: read
  packages: write
  id-token: write # OIDC for cloud registry auth (e.g. AWS)

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle
      - name: make gradlew executable
        shell: bash
        run: chmod +x ./gradlew 2>/dev/null || true
      - name: gradle build
        shell: bash
        env:
          GRADLE_TASKS: ${{ inputs.gradle_tasks }}
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          set -euo pipefail
          args="$GRADLE_TASKS"
          [ "$RUN_TESTS" = "false" ] && args="$args -x test"
          if [ -x ./gradlew ]; then
            ./gradlew $args --no-daemon
          else
            gradle $args --no-daemon
          fi
      - name: upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-artifacts
          path: |
            **/build/libs/*.jar
            **/build/reports/tests/**
          if-no-files-found: ignore

      - name: load product tooling
        if: inputs.build_image
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.product_repo }}
          ref: ${{ inputs.product_ref }}
          path: ._devsecops
      - name: configure AWS credentials
        if: inputs.build_image && inputs.push_image && inputs.registry == 'ecr'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }} # OIDC role; or use the access keys below
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: build & publish image
        id: publish
        if: inputs.build_image
        uses: ./._devsecops/.github/actions/docker-publish
        with:
          registry: ${{ inputs.registry }}
          registry_host: ${{ inputs.registry_host }}
          image_name: ${{ inputs.image_name }}
          extra_tag: ${{ inputs.extra_tag }}
          push: ${{ inputs.push_image }}
          save_artifact: ${{ inputs.save_image_artifact }}
          aws_region: ${{ inputs.aws_region }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          gcp_credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}
